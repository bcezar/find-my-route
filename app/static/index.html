<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roteirizador</title>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container { width: 100%; max-width: 640px; }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.5rem; }

    .section {
      background: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .section-label {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #888;
      margin-bottom: .75rem;
    }

    .input-wrap { position: relative; flex: 1; }

    .input-row { display: flex; gap: .5rem; }

    input[type="text"] {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: #555; }
    input[type="text"]:disabled { background: #f0f0f0; color: #999; cursor: default; }

    .suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
    }
    .suggestions li {
      padding: .55rem .75rem;
      font-size: .9rem;
      cursor: pointer;
      list-style: none;
    }
    .suggestions li:hover { background: #f5f5f5; }
    .suggestions li + li { border-top: 1px solid #f0f0f0; }

    .btn {
      padding: .55rem .9rem;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      line-height: 1;
      white-space: nowrap;
    }
    .btn-add    { background: #222; color: #fff; }
    .btn-add:hover  { background: #444; }
    .btn-add:disabled { background: #ccc; cursor: default; }
    .btn-remove { background: #fee2e2; color: #b91c1c; }
    .btn-remove:hover { background: #fecaca; }

    .set-label {
      display: inline-block;
      margin-top: .6rem;
      font-size: .85rem;
      color: #555;
      padding: .3rem .6rem;
      background: #f0f0f0;
      border-radius: 4px;
    }

    .address-list { list-style: none; display: flex; flex-direction: column; gap: .4rem; margin-top: .75rem; }
    .address-list li { display: flex; align-items: center; gap: .5rem; }
    .address-list li span { flex: 1; font-size: .9rem; background: #f9f9f9; padding: .4rem .65rem; border-radius: 5px; border: 1px solid #eee; }

    .btn-optimize {
      width: 100%;
      padding: .8rem;
      background: #1d4ed8;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
    }
    .btn-optimize:hover:not(:disabled) { background: #1e40af; }
    .btn-optimize:disabled { background: #93c5fd; cursor: default; }

    .error { color: #b91c1c; background: #fee2e2; padding: .75rem 1rem; border-radius: 6px; font-size: .9rem; margin-bottom: 1rem; }

    .result-section { background: #fff; border-radius: 8px; padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .result-section h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }

    .route-list { list-style: none; display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1.25rem; }
    .route-list li { display: flex; gap: .75rem; align-items: baseline; }
    .route-num {
      font-size: .8rem; font-weight: 700; color: #fff; background: #1d4ed8;
      border-radius: 50%; width: 1.4rem; height: 1.4rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .route-addr { font-size: .9rem; }
    .route-coords { font-size: .75rem; color: #888; }

    .maps-link {
      display: inline-block;
      padding: .6rem 1rem;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 600;
    }
    .maps-link:hover { background: #15803d; }

    .total { font-size: .85rem; color: #555; margin-bottom: 1rem; }
    .failures { font-size: .8rem; color: #b91c1c; margin-top: .75rem; }
  </style>
</head>
<body>
<div class="container" x-data="routeApp()">

  <h1>Roteirizador</h1>

  <!-- Origem -->
  <div class="section">
    <div class="section-label">Origem (opcional)</div>
    <div class="input-row">
      <div class="input-wrap" x-ref="originWrap">
        <input type="text" placeholder="Ex: Rua X, 123, Campinas/SP"
               x-model="originInput"
               :disabled="origin !== ''"
               @input.debounce.400ms="fetchSuggestions('origin', originInput)"
               @keydown.escape="originSuggestions = []"
               @keydown.enter="setOrigin()" />
        <ul class="suggestions" x-show="originSuggestions.length > 0" @click.outside="originSuggestions = []">
          <template x-for="s in originSuggestions" :key="s">
            <li @mousedown.prevent="originInput = s; origin = ''; originSuggestions = []" x-text="s"></li>
          </template>
        </ul>
      </div>
      <button class="btn btn-add" @click="setOrigin()" :disabled="originInput.trim() === '' || origin !== ''">+</button>
      <button class="btn btn-remove" x-show="origin !== ''" @click="origin = ''; originInput = ''; originSuggestions = []">−</button>
    </div>
    <span class="set-label" x-show="origin !== ''" x-text="origin"></span>
  </div>

  <!-- Destino -->
  <div class="section">
    <div class="section-label">Destino (opcional)</div>
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" placeholder="Ex: Rua X, 123, Campinas/SP"
               x-model="destInput"
               :disabled="dest !== ''"
               @input.debounce.400ms="fetchSuggestions('dest', destInput)"
               @keydown.escape="destSuggestions = []"
               @keydown.enter="setDest()" />
        <ul class="suggestions" x-show="destSuggestions.length > 0" @click.outside="destSuggestions = []">
          <template x-for="s in destSuggestions" :key="s">
            <li @mousedown.prevent="destInput = s; dest = ''; destSuggestions = []" x-text="s"></li>
          </template>
        </ul>
      </div>
      <button class="btn btn-add" @click="setDest()" :disabled="destInput.trim() === '' || dest !== ''">+</button>
      <button class="btn btn-remove" x-show="dest !== ''" @click="dest = ''; destInput = ''; destSuggestions = []">−</button>
    </div>
    <span class="set-label" x-show="dest !== ''" x-text="dest"></span>
  </div>

  <!-- Endereços -->
  <div class="section">
    <div class="section-label">Endereços <span x-text="'(' + addresses.length + ')'"></span></div>
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" placeholder="Ex: Av. Paulista, 1000, São Paulo/SP"
               x-model="newAddress"
               @input.debounce.400ms="fetchSuggestions('address', newAddress)"
               @keydown.escape="addressSuggestions = []"
               @keydown.enter="addAddress()" />
        <ul class="suggestions" x-show="addressSuggestions.length > 0" @click.outside="addressSuggestions = []">
          <template x-for="s in addressSuggestions" :key="s">
            <li @mousedown.prevent="newAddress = s; addressSuggestions = []" x-text="s"></li>
          </template>
        </ul>
      </div>
      <button class="btn btn-add" @click="addAddress()" :disabled="newAddress.trim() === ''">+</button>
    </div>
    <ul class="address-list" x-show="addresses.length > 0">
      <template x-for="(addr, i) in addresses" :key="i">
        <li>
          <span x-text="addr"></span>
          <button class="btn btn-remove" @click="addresses.splice(i, 1)">−</button>
        </li>
      </template>
    </ul>
  </div>

  <!-- Erro -->
  <div class="error" x-show="error !== ''" x-text="error"></div>

  <!-- Botão otimizar -->
  <button class="btn-optimize"
          @click="optimize()"
          :disabled="loading || addresses.length < 2">
    <span x-show="!loading">Otimizar Rota</span>
    <span x-show="loading">Calculando…</span>
  </button>

  <!-- Resultado -->
  <div class="result-section" x-show="result !== null" style="margin-top:1rem">
    <h2>Rota Otimizada</h2>
    <p class="total" x-text="'Distância total: ' + result?.total_distance_km + ' km'"></p>

    <ul class="route-list">
      <template x-for="stop in result?.optimized_route" :key="stop.order">
        <li>
          <div class="route-num" x-text="stop.order"></div>
          <div>
            <div class="route-addr" x-text="stop.original_address"></div>
            <div class="route-coords" x-text="stop.coordinates.lat.toFixed(5) + ', ' + stop.coordinates.lng.toFixed(5)"></div>
          </div>
        </li>
      </template>
    </ul>

    <a class="maps-link" :href="result?.maps_url" target="_blank" x-show="result?.maps_url">
      Abrir no Google Maps →
    </a>

    <div class="failures" x-show="result?.geocoding_failures?.length > 0">
      Não encontrados: <span x-text="result?.geocoding_failures.join(', ')"></span>
    </div>
  </div>

</div>

<script>
function routeApp() {
  return {
    originInput: '', origin: '', originSuggestions: [],
    destInput:   '', dest:   '', destSuggestions:   [],
    newAddress:  '',             addressSuggestions: [],
    addresses:   [],
    loading:     false,
    result:      null,
    error:       '',

    async fetchSuggestions(field, value) {
      if (value.trim().length < 3) {
        this[field + 'Suggestions'] = [];
        return;
      }
      try {
        const res = await fetch('/api/v1/autocomplete?q=' + encodeURIComponent(value));
        const data = await res.json();
        this[field + 'Suggestions'] = data.suggestions ?? [];
      } catch (_) {
        this[field + 'Suggestions'] = [];
      }
    },

    setOrigin() {
      const v = this.originInput.trim();
      if (v) { this.origin = v; this.originSuggestions = []; }
    },
    setDest() {
      const v = this.destInput.trim();
      if (v) { this.dest = v; this.destSuggestions = []; }
    },
    addAddress() {
      const v = this.newAddress.trim();
      if (v) { this.addresses.push(v); this.newAddress = ''; this.addressSuggestions = []; }
    },

    async optimize() {
      this.error  = '';
      this.result = null;
      this.loading = true;

      const body = { addresses: this.addresses };
      if (this.origin) body.origin      = this.origin;
      if (this.dest)   body.destination = this.dest;

      try {
        const res = await fetch('/api/v1/routes/optimize', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          this.error = data.detail ?? `Erro ${res.status}`;
        } else {
          this.result = data;
        }
      } catch (e) {
        this.error = 'Erro de conexão com a API.';
      } finally {
        this.loading = false;
      }
    },
  };
}
</script>
</body>
</html>
