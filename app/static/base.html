<!DOCTYPE html>
<html lang="{{ i18n.lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" href="{{ i18n.icon }}" />
  <link rel="apple-touch-icon" href="{{ i18n.icon }}" />
  <meta name="description" content="{{ description }}" />
  <link rel="canonical" href="{{ canonical }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ canonical }}" />
  <meta property="og:title" content="{{ title }}" />
  <meta property="og:description" content="{{ description }}" />
  <meta property="og:image" content="{{ base_url }}/capa.png" />
  <meta property="og:locale" content="{{ i18n.og_locale }}" />
  <meta property="og:site_name" content="{{ i18n.brand }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ title }}" />
  <meta name="twitter:description" content="{{ description }}" />
  <meta name="twitter:image" content="{{ base_url }}/capa.png" />
  <link rel="stylesheet" href="/style.css?v={{ css_version }}" />
  {% block extra_head %}{% endblock %}
  {% if ga_measurement_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ ga_measurement_id }}');
  </script>
  {% endif %}
</head>
<body class="seo-page">

  <header class="seo-header">
    <a href="/" style="display:flex;align-items:center;gap:.5rem;text-decoration:none">
      <img src="{{ i18n.logo }}" alt="{{ i18n.brand }}" class="seo-header-logo" />
      <span class="seo-header-title">{{ i18n.brand }}</span>
    </a>
    <a href="/" class="seo-header-cta">Otimizar rota →</a>
  </header>

  <main class="seo-container">
    {% block content %}{% endblock %}
  </main>

  <footer class="seo-footer">
    <p>© 2026 {{ i18n.brand }} · <a href="/">Otimizador de Rotas Gratuito</a> · <a href="/perguntas-frequentes">FAQ</a> · <a href="/como-funciona">Como funciona</a></p>
  </footer>

  {% block schema %}{% endblock %}
</body>
</html>
